<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modifier l'article — JENIFFA TRADE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #C9A84C; --dark: #1A1A2E; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F4F1EC; }
    .topbar { background: var(--dark); color: white; display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; }
    .topbar-brand { font-weight: 900; letter-spacing: 2px; color: var(--gold); font-size: 1.1rem; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 50px; padding: 8px 18px; font-size: .8rem; font-weight: 700; cursor: pointer; text-decoration: none; border: none; }
    .btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,.3); color: white; }
    .form-wrap { max-width: 620px; margin: 32px auto; background: white; border-radius: 20px; padding: 36px 40px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; font-weight: 800; color: var(--dark); margin-bottom: 28px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: .8rem; font-weight: 700; color: #555; margin-bottom: 7px; letter-spacing: .3px; text-transform: uppercase; }
    input[type=text], input[type=url], select, textarea {
      width: 100%; padding: 12px 16px; border: 2px solid #E8E8E8; border-radius: 12px;
      font-size: .92rem; font-family: inherit; outline: none; transition: border .2s; color: #333;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }
    .current-img { display: block; max-height: 160px; border-radius: 10px; margin-bottom: 12px; border: 2px solid #EEE; }
    .file-area { border: 2px dashed #DDD; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; position: relative; }
    .file-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-area p { color: #888; font-size: .82rem; margin-top: 6px; }
    #preview { max-width: 100%; max-height: 160px; border-radius: 10px; margin-top: 12px; display: none; }
    .hint { font-size: .75rem; color: #aaa; margin-top: 5px; }
    .submit-btn { width: 100%; padding: 16px; background: var(--dark); color: var(--gold); border: none; border-radius: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 8px; transition: opacity .2s; }
    .submit-btn:hover { opacity: .85; }
    @media (max-width: 480px) { .form-wrap { margin: 16px; padding: 24px 20px; } }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">JENIFFA TRADE — Admin</div>
  <a href="/admin/dashboard" class="btn btn-outline">← Retour</a>
</div>

<div class="form-wrap">
  <h1>Modifier l'article</h1>

  <form method="POST" enctype="multipart/form-data">

    <div class="field">
      <label>Nom de l'article *</label>
      <input type="text" name="name" value="{{ product.name }}" required/>
    </div>

    <div class="field">
      <label>Prix *</label>
      <input type="text" name="price" value="{{ product.price }}" required/>
    </div>

    <div class="field">
      <label>Catégorie *</label>
      <select name="category" required>
        <option value="Mode Femme" {% if product.category == 'Mode Femme' %}selected{% endif %}>Mode Femme</option>
        <option value="Kids" {% if product.category == 'Kids' %}selected{% endif %}>Kids</option>
        <option value="Beauté & Care" {% if product.category == 'Beauté & Care' %}selected{% endif %}>Beauté & Care</option>
      </select>
    </div>

    <div class="field">
      <label>Description</label>
      <textarea name="description">{{ product.description }}</textarea>
    </div>

    <div class="field">
      <label>Photo</label>
      {% if product.image_path %}
      <img class="current-img" src="/static/uploads/{{ product.image_path }}" alt="Photo actuelle"/>
      <p style="font-size:.75rem;color:#aaa;margin-bottom:8px">Photo actuelle — choisissez-en une nouvelle pour la remplacer</p>
      {% endif %}
      <div class="file-area">
        <input type="file" name="image" accept="image/*" id="file-input" onchange="previewImg(this)"/>
        <p>📷 Choisir une nouvelle photo (optionnel)</p>
      </div>
      <img id="preview" src="" alt="Aperçu"/>
    </div>

    <div class="field">
      <label>Lien vidéo</label>
      <input type="url" name="video_link" value="{{ product.video_link }}" placeholder="https://www.tiktok.com/@..."/>
      <div class="hint">Lien TikTok, Instagram ou YouTube</div>
    </div>

    <button type="submit" class="submit-btn">Enregistrer les modifications</button>
  </form>
</div>

<script>
  function previewImg(input) {
    const p = document.getElementById('preview');
    if (input.files && input.files[0]) { p.src = URL.createObjectURL(input.files[0]); p.style.display = 'block'; }
  }
</script>
</body>
</html>
